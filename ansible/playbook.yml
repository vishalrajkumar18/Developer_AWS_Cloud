---
# ============================================================
# CivicTrack Ansible Playbook – Server Configuration & Deploy
# ============================================================
- name: Configure CivicTrack EC2 Server and Deploy Stack
  hosts: civictrack_servers
  become: yes
  vars:
    app_root: /opt/civictrack
    git_repo_url: https://github.com/vishalrajkumar18/Developer_AWS_Cloud.git

  tasks:
    - name: 1. Update APT package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Install essential system dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - ufw
        state: present

    - name: 3. Add Docker official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: 4. Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: 5. Install Docker Engine and Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: 6. Ensure Docker service is running and enabled on boot
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: 7. Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: 8. Create application root directory
      file:
        path: "{{ app_root }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: 9. Clone or pull latest CivicTrack repository
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ app_root }}"
        version: main
        force: yes
      become_user: ubuntu

    - name: 10. Copy production environment file
      copy:
        src: "{{ app_root }}/.env.example"
        dest: "{{ app_root }}/.env"
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: 11. Launch CivicTrack Multi-Container Stack with Docker Compose
      command: docker compose -f docker/docker-compose.yml up -d --build
      args:
        chdir: "{{ app_root }}"
      become_user: ubuntu

    - name: 12. Wait for Backend service health check (port 5000)
      uri:
        url: http://localhost:5000/health
        status_code: 200
      register: backend_health
      until: backend_health.status == 200
      retries: 12
      delay: 5

    - name: 13. Wait for Frontend service health check (port 80)
      uri:
        url: http://localhost/health
        status_code: 200
      register: frontend_health
      until: frontend_health.status == 200
      retries: 6
      delay: 5

    - name: 14. Display Deployment Summary
      debug:
        msg:
          - "=========================================================="
          - " CivicTrack Application Successfully Deployed via Ansible!"
          - " Web Application: http://{{ ansible_host }}"
          - " Backend API:     http://{{ ansible_host }}:5000"
          - " Prometheus:      http://{{ ansible_host }}:9090"
          - " Grafana:         http://{{ ansible_host }}:3001"
          - "=========================================================="
