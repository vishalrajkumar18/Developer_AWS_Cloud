name: CivicTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_FRONTEND_REPO: civictrack-frontend
  ECR_BACKEND_REPO: civictrack-backend

jobs:
  # ============================================================
  # Stage 1: Build & Automated Tests
  # ============================================================
  test:
    name: 🧪 Build & Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Frontend Validation
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      # Backend Validation
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Flask App Initialization
        working-directory: backend
        env:
          USE_SQLITE: "true"
          FLASK_ENV: "testing"
          SECRET_KEY: "test-secret"
        run: |
          python -c "from app import create_app; app = create_app(); print('Flask app factory initialized successfully!')"

  # ============================================================
  # Stage 2: Docker Build & Push to Amazon ECR
  # ============================================================
  build-and-push:
    name: 🐳 Docker Build & ECR Push
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and Push Backend Image
      - name: Build & Push Backend Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG -t $REGISTRY/$ECR_BACKEND_REPO:latest backend
          docker push $REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest

      # Build and Push Frontend Image
      - name: Build & Push Frontend Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG -t $REGISTRY/$ECR_FRONTEND_REPO:latest frontend
          docker push $REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest

  # ============================================================
  # Stage 3: Deploy to AWS EC2 Instance
  # ============================================================
  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting CivicTrack Deployment..."
            cd /opt/civictrack

            # Pull latest code
            git pull origin main

            # Login to ECR on EC2
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

            # Pull latest containers and recreate
            docker compose -f docker/docker-compose.yml pull backend frontend
            docker compose -f docker/docker-compose.yml up -d --force-recreate

            # Verify Health Check
            sleep 10
            curl -f http://localhost:5000/health || (echo "Backend health check failed!" && exit 1)
            curl -f http://localhost/health || (echo "Frontend health check failed!" && exit 1)

            echo "✅ CivicTrack Deployment Completed Successfully!"
