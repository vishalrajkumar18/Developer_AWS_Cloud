version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: civictrack_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: civictrack_db
      MYSQL_USER: civic_user
      MYSQL_PASSWORD: civic_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: civictrack_backend_dev
    command: python run.py
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - SECRET_KEY=dev-secret-key
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=civictrack_db
      - MYSQL_USER=civic_user
      - MYSQL_PASSWORD=civic_password
      - DATABASE_URL=mysql+pymysql://civic_user:civic_password@mysql:3306/civictrack_db
    ports:
      - "5000:5000"
    volumes:
      - ../backend:/app
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_dev_data:
