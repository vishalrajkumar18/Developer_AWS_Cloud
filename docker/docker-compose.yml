version: '3.8'

services:
  # ============================================================
  # 1. MySQL Database Service
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: civictrack_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: civictrack_db
      MYSQL_USER: civic_user
      MYSQL_PASSWORD: civic_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - civictrack_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # 2. Flask REST API Backend
  # ============================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: civictrack-backend:latest
    container_name: civictrack_backend
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=civictrack-super-secret-key-production-2024
      - JWT_SECRET_KEY=civictrack-jwt-production-secret-2024
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=civictrack_db
      - MYSQL_USER=civic_user
      - MYSQL_PASSWORD=civic_password
      - DATABASE_URL=mysql+pymysql://civic_user:civic_password@mysql:3306/civictrack_db
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - civictrack_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================
  # 3. React Frontend (Nginx Reverse Proxy)
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: civictrack-frontend:latest
    container_name: civictrack_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civictrack_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ============================================================
  # 4. Prometheus Monitoring Service
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: civictrack_prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - civictrack_network

  # ============================================================
  # 5. Grafana Dashboard Service
  # ============================================================
  grafana:
    image: grafana/grafana:11.0.0
    container_name: civictrack_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - civictrack_network

networks:
  civictrack_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
